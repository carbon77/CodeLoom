opencollection: 1.0.0

info:
  name: CodeLoom
config:
  proxy:
    inherit: true
    config:
      protocol: http
      hostname: ""
      port: ""
      auth:
        username: ""
        password: ""
      bypassProxy: ""

request:
  auth:
    type: oauth2
    flow: client_credentials
    accessTokenUrl: http://localhost:8080/realms/codeloom/protocol/openid-connect/token
    credentials:
      clientId: backend
      clientSecret: ziBFw6rlgYdy3e70grJ9CHVb4i2MnSZC
      placement: basic_auth_header
    tokenConfig:
      placement:
        header: Bearer
      source: access_token
    settings:
      autoFetchToken: true
      autoRefreshToken: false
bundled: false
extensions:
  bruno:
    ignore:
      - node_modules
      - .git
