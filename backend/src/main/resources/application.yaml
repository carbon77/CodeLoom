server:
  port: ${CODELOOM_PORT:8080}
  error:
    include-stacktrace: never

spring:
  application:
    name: backend
  datasource:
    url: ${CODELOOM_DB_URL}
    username: ${CODELOOM_DB_USER}
    password: ${CODELOOM_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/realms/codeloom
  kafka:
    bootstrap-servers: localhost:29092
    producer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    consumer:
      group-id: codeloom
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest

springdoc:
  api-docs:
    path: /docs/api
  swagger-ui:
    path: /docs/swagger.html

logging:
  level:
    org.springframework.security: TRACE

codeloom:
  kafka:
    submission-topic: submissions